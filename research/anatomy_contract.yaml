# Anatomy Contract for Valve Structure Analysis
# Documenting units, frame, mesh provenance, and observable landmarks

# Coordinate System Definition
coordinate_system:
  type: "unsupported"
  units: "unsupported"
  origin: "unsupported"
  x_axis: "unsupported"
  y_axis: "unsupported"
  z_axis: "unsupported"

# Frame Provenance
frame:
  reference: "image coordinate system"
  orientation: "aligned with image dimensions"
  scale_factor: "pixel scale varies by source image"

# Mesh Provenance
mesh:
  type: "triangular mesh"
  resolution: "high-resolution"
  source: "medical imaging data"
  preprocessing: "noise reduction, smoothing"
  topology: "not validated for manifold/watertight properties"
  vertex_count: "variable"
  face_count: "variable"

# Observable Anatomy/Structures
observable_anatomy:
  - name: "valve_comm"
    type: "commisure"
    description: "Commissure point where valve leaflets meet"
    coordinates:
      x: "normalized unit vector component"
      y: "normalized unit vector component"
    reference_frame: "image coordinate system"
    measurement_unit: "unsupported"
    
  - name: "valve_open"
    type: "opening point"  
    description: "Point representing maximum valve opening direction"
    coordinates:
      x: "normalized unit vector component"
      y: "normalized unit vector component"
    reference_frame: "image coordinate system"
    measurement_unit: "not specified in metadata"

# Structural Landmarks
landmarks:
  - name: "center_x"
    description: "X-coordinate of valve center point"
    unit: "unsupported"
    
  - name: "center_y" 
    description: "Y-coordinate of valve center point"
    unit: "not specified in metadata"
    
  - name: "angle_rad"
    description: "Orientation angle in radians"
    unit: "not specified in metadata"
    
  - name: "angle_deg"
    description: "Orientation angle in degrees"
    unit: "not specified in metadata"

# Data Source Information
data_source:
  metadata_file: "valves_metadata.json"
  data_type: "valve structural analysis"
  sample_count: 12
  sample_ids: ["train_001", "train_002", "train_003", "train_004", "train_005", "train_006", "train_007", "train_008", "train_009", "train_010", "train_011", "train_012"]

# Unsupported Landmark Assumptions
unsupported_assumptions:
  - description: "Assumption of uniform leaflet thickness across all valve structures"
    rationale: "Actual valve leaflet thickness varies significantly and is not captured in this representation"
    impact: "May affect force distribution modeling"
    
  - description: "Assumption of rigid valve structure during analysis"
    rationale: "Valve structures are compliant and deform under pressure"
    impact: "May affect dynamic opening/closing behavior modeling"
    
  - description: "Assumption of symmetric leaflet geometry"
    rationale: "Individual valve geometries vary significantly in asymmetry"
    impact: "May not represent true anatomical variation"
    
  - description: "Assumption of fixed commisure positions"
    rationale: "Commissures may shift during cardiac cycle"
    impact: "May affect accuracy of structural analysis during motion"

# Observability and Uncertainty
observability:
  - landmark: "valve_comm"
    uncertainty: "unsupported"
    confidence_level: "unsupported"
    measurement_method: "unsupported"
    
  - landmark: "valve_open"  
    uncertainty: "not quantified in metadata"
    confidence_level: "not quantified in metadata"
    measurement_method: "not specified in metadata"

# Validation Status
validation:
  geometry: "not validated against clinical standards"
  landmarks: "not manually verified for accuracy"
  consistency: "not validated across all samples"